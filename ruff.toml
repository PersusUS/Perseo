# Configuración de ruff. Existe por una razón concreta: `ruff check .` decía
# «77 errores» y los 77 estaban en un cuaderno de Colab —celdas con varios
# importes en una línea, que es como se escriben los cuadernos—. Un linter que
# siempre grita en rojo deja de leerse, y con él se pierden los avisos que sí
# valían: el `pytest` sin importar de `test_agenda.py` llevaba semanas ahí.
#
#     ruff check .          lo que hay
#     ruff check . --fix    lo que se arregla solo

line-length = 100

exclude = [
    # Cuadernos: el estilo lo manda Colab, no nosotros.
    "commands/modelos/*.ipynb",
    # Lo que no escribimos.
    "RealTime/src-tauri/target",
    "node_modules",
    # La lista de excepciones de `vulture` no es código: son nombres sueltos
    # para que la herramienta los dé por vivos. Para ruff son veinticuatro
    # `F821 Undefined name`, que es exactamente lo que este fichero evita
    # cuando se lee: ruido que tapa los avisos que sí valen.
    "verificadores/vulture_permitidos.py",
]
