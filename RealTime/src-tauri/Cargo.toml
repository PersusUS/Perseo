[package]
name = "perseo"
version = "0.1.0"
description = "Perseo — asistente personal por voz y pantalla"
authors = ["Jesús Pérez Bazarot"]
edition = "2021"

# Se llamaba `temp-app`, y renombrarlo rompia en silencio el detector de
# aplausos, que buscaba `temp-app.exe` en el tasklist. Las dos cosas se
# arreglaron a la vez (2026-08-16): la aplicacion deja ahora su PID en un
# fichero (`presencia.rs`) y el detector pregunta por el proceso, no por el
# nombre.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "perseo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` e `image-png` para el icono de la bandeja: sin la segunda, el
# icono por defecto de la app no se puede cargar y la bandeja sale vacia.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-screenshots = "2.2"
tauri-plugin-store = "2"
xcap = "0.0.13"
image = "0.25"
base64 = "0.22"
# Espera asincrona entre sondeos al nucleo. Nada bloqueante dentro de un comando
# async de Tauri: eso secuestraba un worker del runtime durante segundos.
tokio = { version = "1", features = ["time"] }
# Cliente HTTP hacia perseo-core. Sin TLS a proposito: el nucleo escucha en el
# bucle local y en el tailnet, que ya va cifrado por WireGuard, asi que arrastrar
# una pila de TLS entera solo anadiria peso al binario.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
