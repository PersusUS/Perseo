[package]
name = "temp-app"
version = "0.1.0"
description = "Perseo — asistente personal por voz y pantalla"
authors = ["Jesús Pérez Bazarot"]
edition = "2021"

# NOTA: el nombre del paquete sigue siendo `temp-app` a proposito, de momento.
# `clap_detector.py` y `loading_splash.py` detectan la aplicacion buscando
# `temp-app.exe` en el tasklist, asi que renombrarlo los rompe en silencio.
# El cambio va junto en la Fase 5. Ver H-21.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "temp_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` e `image-png` para el icono de la bandeja: sin la segunda, el
# icono por defecto de la app no se puede cargar y la bandeja sale vacia.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-screenshots = "2.2"
tauri-plugin-store = "2"
xcap = "0.0.13"
image = "0.25"
base64 = "0.22"
# Espera asincrona entre sondeos al nucleo. Nada bloqueante dentro de un comando
# async de Tauri: eso secuestraba un worker del runtime durante segundos (H-10).
tokio = { version = "1", features = ["time"] }
# Cliente HTTP hacia perseo-core. Sin TLS a proposito: el nucleo escucha en el
# bucle local y en el tailnet, que ya va cifrado por WireGuard, asi que arrastrar
# una pila de TLS entera solo anadiria peso al binario.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
