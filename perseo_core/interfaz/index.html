<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Perseo</title>
<link rel="manifest" href="/manifest.webmanifest">
<!-- iOS ignora los iconos del manifiesto: usa este. Sin él, la pantalla de
     inicio guarda una captura de la página. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* Un solo fichero a propósito: sin build, sin dependencias y sin una segunda
     petición que pueda quedarse a medias por el túnel de Tailscale. Las dos
     excepciones son la ola y el avatar, que pesan 190 KB entre los dos: dentro
     del HTML se bajarían enteros en cada carga y aparte los cachea el
     navegador.

     El aspecto sale de la app de voz (RealTime/src/styles/globals.css): negro,
     monocromo, tipografía fina y muy espaciada. El color se reserva para una
     cosa sola —los puntos de estado— porque cuando todo es blanco, lo que se
     pone ámbar se ve desde el otro lado de la habitación. */
  :root {
    color-scheme: dark;
    --fondo: #000000;
    --texto: #ffffff;
    --tenue: #999999;
    --apagado: #555555;
    --superficie: rgba(255, 255, 255, .05);
    --superficie-alta: rgba(255, 255, 255, .12);
    --borde: rgba(255, 255, 255, .14);
    --ok: #4ade80;
    --aviso: #fbbf24;
    --malo: #f87171;
    --tipo: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: var(--tipo);
    font-size: 15px;
    font-weight: 300;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    /* En el iPhone en pantalla completa, sin esto la barra inferior se come el
       campo de escribir. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* La ola, igual que en la app: fija, muy tenue y por debajo de todo. */
  #ola {
    position: fixed;
    inset: 0;
    background: url('/hokusai-bg.png') center bottom / cover no-repeat;
    opacity: .07;
    pointer-events: none;
    z-index: 0;
  }
  body > *:not(#ola) { position: relative; z-index: 1; }

  .mayus {
    text-transform: uppercase;
    letter-spacing: .18em;
    font-size: 11px;
    color: var(--tenue);
  }

  /* ------------------------------------------------------------------ */
  /* Cabecera                                                            */
  /* ------------------------------------------------------------------ */

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--borde);
  }
  header img {
    width: 30px; height: 30px; border-radius: 50%;
    object-fit: cover;
    filter: grayscale(100%) brightness(.85);
    border: 1px solid var(--borde);
  }
  header h1 {
    font-size: 14px; font-weight: 300;
    text-transform: uppercase; letter-spacing: .5em;
  }
  #conexion { margin-left: auto; display: flex; align-items: center; gap: 7px; }
  .punto {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--apagado);
    flex: none;
  }
  .punto.ok { background: var(--ok); }
  .punto.aviso { background: var(--aviso); }
  .punto.malo { background: var(--malo); }
  .punto.viva { background: var(--ok); }
  .punto.rota { background: var(--malo); }

  nav { display: flex; border-bottom: 1px solid var(--borde); }
  nav button {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 1px solid transparent;
    color: var(--apagado);
    padding: 11px 4px;
    font: inherit;
    text-transform: uppercase;
    letter-spacing: .14em;
    font-size: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  nav button[aria-selected="true"] { color: var(--texto); border-bottom-color: var(--texto); }
  nav .cuenta { color: var(--aviso); letter-spacing: 0; }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  section[hidden] { display: none; }
  section { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  /* ------------------------------------------------------------------ */
  /* Chat                                                                */
  /* ------------------------------------------------------------------ */

  .burbuja {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    animation: subir .25s ease;
  }
  .mio { align-self: flex-end; background: var(--texto); color: var(--fondo); font-weight: 400; }
  .suyo { align-self: flex-start; background: var(--superficie); border: 1px solid var(--borde); }
  .nota {
    align-self: center; text-align: center;
    font-size: 12px; color: var(--apagado); font-style: italic;
  }

  /* El turno de palabra, encima de cada burbuja. Es lo que convierte una lista
     de globos en una transcripción: se sabe quién habla sin fijarse en de qué
     lado está, y la hora dice si esto es de ahora o de anteayer. */
  .turno {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .16em;
    color: var(--apagado); margin-bottom: -6px;
  }
  .turno.mio { align-self: flex-end; }
  .turno.suyo { align-self: flex-start; }
  .turno .hora { font-variant-numeric: tabular-nums; opacity: .65; }

  /* Perseo habla con marco de mira, como las tarjetas del tablero (T-7). */
  .burbuja.suyo { position: relative; }
  .burbuja.suyo::before, .burbuja.suyo::after {
    content: ""; position: absolute; width: 8px; height: 8px;
    pointer-events: none; opacity: .45;
  }
  .burbuja.suyo::before { top: 5px; left: 5px; border-top: 1px solid var(--texto); border-left: 1px solid var(--texto); }
  .burbuja.suyo::after { right: 5px; bottom: 5px; border-right: 1px solid var(--texto); border-bottom: 1px solid var(--texto); }

  /* Pensando: tres puntos que laten por turnos. Sin esto, mandar un mensaje y
     esperar cuatro segundos se ve exactamente igual que una app rota. */
  .pensando { display: flex; align-items: center; gap: 6px; }
  .pensando span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--tenue);
    animation: pulso 1.2s ease-in-out infinite;
  }
  .pensando span:nth-child(2) { animation-delay: .18s; }
  .pensando span:nth-child(3) { animation-delay: .36s; }
  @keyframes pulso {
    0%, 100% { opacity: .25; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-2px); }
  }

  /* La cabecera del chat: quién eres, con qué hablas y desde cuándo. */
  #chat-lectura {
    display: flex; align-items: center; gap: 8px; align-self: stretch;
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .16em;
    color: var(--apagado); padding-bottom: 4px;
    border-bottom: 1px solid var(--borde);
  }
  #chat-lectura .latido {
    width: 5px; height: 5px; border-radius: 50%; background: var(--texto);
    animation: latido 2.4s ease-in-out infinite;
  }
  #chat-lectura button {
    margin-left: auto; background: none; border: none; color: var(--apagado);
    font: inherit; text-transform: uppercase; letter-spacing: .16em;
    cursor: pointer; padding: 2px 0;
  }
  #chat-lectura button:hover { color: var(--texto); }
  @keyframes subir {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ------------------------------------------------------------------ */
  /* Tarjetas (cola, correo y estado comparten caja)                     */
  /* ------------------------------------------------------------------ */

  .tarjeta {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .tarjeta .cabeza {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--tenue);
    text-transform: uppercase; letter-spacing: .1em;
  }
  .tarjeta .cuerpo { margin-top: 7px; overflow-wrap: anywhere; }
  .tarjeta .resultado {
    margin-top: 7px; font-size: 13px; color: var(--tenue);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .etiqueta {
    padding: 1px 8px; border-radius: 999px;
    border: 1px solid currentColor; font-size: 10px;
    letter-spacing: .1em;
  }
  .pendiente, .esperando { color: var(--aviso); }
  .en_curso  { color: var(--texto); }
  .hecho     { color: var(--ok); }
  .fallido   { color: var(--malo); }
  .cancelado, .rechazado { color: var(--apagado); }

  /* Una línea por correo, con su cajón delante. */
  .correo { margin-top: 7px; }
  .correo .motivo { color: var(--apagado); font-size: 12px; }

  /* Un correo resuelto no se esconde: se apaga y se va al fondo de su cajón.
     Esconderlo impediría ver que el triaje se ha comido algo, y es justo la
     comprobación que hace falta mientras el triaje siga siendo un modelo. */
  .correo.resuelto { opacity: .4; }
  .correo.resuelto .asunto { text-decoration: line-through; }
  .correo .acciones { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .correo .acciones button {
    background: none; border: 1px solid var(--borde); color: var(--apagado);
    border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 11px;
    cursor: pointer;
  }
  .correo .acciones button:hover { color: var(--texto); border-color: var(--texto); }
  .correo .acciones button.hecho { border-color: var(--ok); color: var(--ok); }
  .clase {
    padding: 1px 7px; border-radius: 999px; font-size: 10px;
    border: 1px solid currentColor; color: var(--tenue);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .clase.requiere_accion, .clase.no_seguro { color: var(--aviso); }
  .clase.interesante { color: var(--texto); }

  .pregunta {
    margin-top: 10px;
    padding: 9px 12px;
    border-left: 2px solid var(--aviso);
    background: rgba(251, 191, 36, .07);
    border-radius: 0 10px 10px 0;
  }
  .pregunta .detalle { margin-top: 4px; font-size: 13px; color: var(--tenue); }

  .acciones { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  button.pildora {
    background: none; border: 1px solid var(--borde); color: var(--texto);
    border-radius: 999px; padding: 6px 15px; font: inherit; font-size: 12px;
    text-transform: uppercase; letter-spacing: .1em;
    cursor: pointer; transition: background .2s, border-color .2s;
  }
  button.pildora:hover { background: var(--superficie-alta); }
  button.pildora:disabled { opacity: .4; }
  button.pildora.aprobar { border-color: var(--ok); color: var(--ok); }
  button.pildora.peligro:hover { border-color: var(--malo); color: var(--malo); }

  /* ------------------------------------------------------------------ */
  /* Estado                                                              */
  /* ------------------------------------------------------------------ */

  .titulo-grupo {
    display: flex; align-items: baseline; gap: 10px;
    margin-top: 6px;
  }
  .titulo-grupo::after {
    content: ""; flex: 1; height: 1px; background: var(--borde);
  }

  .pieza { display: flex; gap: 11px; align-items: flex-start; }
  .pieza .punto { margin-top: 7px; }
  .pieza .nombre { font-weight: 400; }
  .pieza .detalle { color: var(--tenue); font-size: 13px; overflow-wrap: anywhere; }
  .pieza .arreglo {
    margin-top: 5px; font-size: 12px; color: var(--apagado);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-wrap: anywhere;
  }

  .barra {
    height: 3px; border-radius: 999px; background: var(--superficie-alta);
    margin-top: 7px; overflow: hidden;
  }
  .barra span { display: block; height: 100%; background: var(--texto); }
  .barra span.lleno { background: var(--malo); }

  .cifras { display: flex; flex-wrap: wrap; gap: 18px; }
  .cifra { display: flex; flex-direction: column; gap: 2px; }
  .cifra b { font-size: 22px; font-weight: 200; }

  /* La memoria. El formulario va dentro de la sección y no en el pie: el pie es
     del chat, y con dos campos de escribir a la vez no se sabe cuál contesta. */
  #memoria form { border: none; padding: 0; }
  /* Anotar necesita dos campos y un botón, así que se apila. Buscar es una
     línea y se queda en fila: son dos gestos distintos y se parecen poco. */
  #anotar-memoria { flex-direction: column; }
  #anotar-memoria[hidden] { display: none; }
  textarea {
    font: inherit; border-radius: 12px; border: 1px solid var(--borde);
    background: var(--superficie); color: var(--texto); padding: 11px 14px;
    resize: vertical; min-height: 90px;
  }
  textarea:focus { outline: none; border-color: rgba(255, 255, 255, .35); }
  #anotar-memoria button { align-self: flex-end; }
  #notas { display: flex; flex-direction: column; gap: 10px; }
  .nota-vault summary {
    cursor: pointer; text-transform: none; letter-spacing: 0;
    color: var(--texto); font-size: 15px; margin: 0;
  }
  .nota-vault .ruta {
    font-size: 11px; color: var(--apagado); margin-top: 2px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-wrap: anywhere;
  }
  .nota-vault .extracto { font-size: 13px; color: var(--tenue); margin-top: 6px; }
  .nota-vault .contenido {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--borde);
    font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 50vh; overflow-y: auto;
  }

  /* Filtros de la cola. Van arriba y siempre visibles: si hay que desplegarlos,
     no se usan, y el caso que importa —"¿qué me ha pedido confirmación?"— es
     justo el que se busca con prisa. */
  .filtros { display: flex; flex-wrap: wrap; gap: 6px; }
  .filtro {
    background: none; border: 1px solid var(--borde); color: var(--apagado);
    border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 11px;
    text-transform: uppercase; letter-spacing: .08em; cursor: pointer;
  }
  .filtro[aria-pressed="true"] { color: var(--fondo); background: var(--texto); border-color: var(--texto); }

  /* Puesto de mando (T-7). El encargo fue «rollo NERV, cyberpunk japonés de
     los noventa», con el límite de que siga siendo esta interfaz: negra,
     monocroma y con la ola detrás. Así que el aire lo dan la geometría y el
     movimiento, no el color: esquinas marcadas como una mira, versalitas muy
     espaciadas y una línea que se mueve. El color sigue siendo de los puntos
     de estado y de nadie más. */
  .hud { position: relative; }
  .hud::before, .hud::after {
    content: ""; position: absolute; width: 11px; height: 11px;
    pointer-events: none; opacity: .5;
  }
  .hud::before { top: 6px; left: 6px; border-top: 1px solid var(--texto); border-left: 1px solid var(--texto); }
  .hud::after { right: 6px; bottom: 6px; border-right: 1px solid var(--texto); border-bottom: 1px solid var(--texto); }

  .lineas { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .linea-cabeza { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .linea-valor { font-size: 12px; font-variant-numeric: tabular-nums; }
  .linea svg { width: 100%; height: 34px; display: block; margin-top: 5px; }
  .linea-trazo { fill: none; stroke: var(--texto); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .linea-area { fill: rgba(255,255,255,.07); stroke: none; }

  .cita {
    display: flex; align-items: baseline; gap: 12px; padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .cita:last-of-type { border-bottom: none; }
  .cita-hora {
    font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: .06em;
    min-width: 44px;
  }
  .cita-titulo {
    font-size: 12px; color: var(--apagado);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .separado { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--borde); }

  .lectura {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 0 2px 10px; font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--apagado);
    font-variant-numeric: tabular-nums;
  }
  .lectura-sep { opacity: .4; }
  /* El punto que late: un panel quieto y un panel colgado se ven igual. */
  .latido {
    width: 6px; height: 6px; border-radius: 50%; background: var(--texto);
    animation: latido 2.4s ease-in-out infinite;
  }
  @keyframes latido { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .linea-mitad { stroke: rgba(255,255,255,.12); stroke-width: 1; stroke-dasharray: 3 5; vector-effect: non-scaling-stroke; }
  .linea-punta { fill: var(--texto); }

  /* Medidores. En el móvil van apilados y a todo el ancho: una rejilla de
     esferas tipo HUD queda muy bien en una pantalla de 27 pulgadas y es
     ilegible en 375 px. La información es la misma; la forma, no. */
  .medidas { display: flex; flex-direction: column; gap: 11px; margin-top: 10px; }
  .medida-cabeza {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--tenue);
  }
  .carril {
    height: 4px; border-radius: 999px; background: var(--superficie);
    overflow: hidden; margin-top: 5px;
  }
  .relleno {
    height: 100%; background: var(--texto); border-radius: 999px;
    transition: width .6s ease;
  }
  .relleno.aviso { background: var(--aviso); }
  .relleno.malo { background: var(--malo); }

  .fichas { display: flex; flex-wrap: wrap; gap: 8px; }
  .ficha {
    border: 1px solid var(--borde); border-radius: 999px;
    padding: 4px 12px; font-size: 12px; color: var(--tenue);
  }
  .ficha.apagada { color: var(--apagado); border-style: dashed; }

  details summary {
    cursor: pointer; color: var(--apagado); font-size: 12px;
    text-transform: uppercase; letter-spacing: .1em; margin-top: 8px;
  }

  /* ------------------------------------------------------------------ */
  /* Escribir y puerta                                                   */
  /* ------------------------------------------------------------------ */

  form {
    display: flex; gap: 10px; padding: 12px 16px;
    border-top: 1px solid var(--borde);
    /* El teclado del iPhone no encoge la página: la tapa. Sin este hueco —que
       el JavaScript rellena con lo que mide el teclado— el campo de escribir
       queda debajo, y la conversación larga se escribe a ciegas. */
    padding-bottom: calc(12px + var(--teclado, 0px));
    transition: padding-bottom .18s ease;
  }
  input, form button {
    font: inherit;
    border-radius: 12px;
    border: 1px solid var(--borde);
    background: var(--superficie);
    color: var(--texto);
    padding: 11px 14px;
  }
  input { flex: 1; min-width: 0; }
  input:focus { outline: none; border-color: rgba(255, 255, 255, .35); }
  form button {
    background: var(--texto); color: var(--fondo); border-color: var(--texto);
    font-weight: 400; text-transform: uppercase; letter-spacing: .12em;
    font-size: 12px; cursor: pointer;
  }
  form button:disabled { opacity: .5; }

  #puerta {
    position: fixed; inset: 0; z-index: 10; background: var(--fondo);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 26px; text-align: center;
  }
  #puerta .cara { position: relative; width: 150px; height: 150px; }
  #puerta .cara img {
    width: 150px; height: 150px; border-radius: 50%;
    object-fit: cover; position: relative; z-index: 2;
    filter: grayscale(100%) brightness(.85);
    border: 1px solid rgba(255, 255, 255, .2);
  }
  /* Las mismas ondas concéntricas que la app mientras escucha. */
  .onda {
    position: absolute; top: 50%; left: 50%;
    width: 150px; height: 150px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .2);
    transform: translate(-50%, -50%);
    animation: onda-fuera 2s ease-out infinite;
    z-index: 1;
  }
  .onda.b { animation-delay: .66s; }
  .onda.c { animation-delay: 1.33s; }
  @keyframes onda-fuera {
    0%   { transform: translate(-50%, -50%) scale(1); opacity: .4; }
    100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
  }
  #puerta h1 {
    font-size: 16px; font-weight: 200;
    text-transform: uppercase; letter-spacing: .7em; text-indent: .7em;
  }
  #puerta p { color: var(--apagado); max-width: 34ch; font-size: 13px; }
  #puerta form { border: none; width: 100%; max-width: 380px; }
  #puerta .error { color: var(--malo); font-size: 13px; min-height: 1.2em; }

  /* ------------------------------------------------------------------ */
  /* El teclado del móvil                                                */
  /* ------------------------------------------------------------------ */

  /* Safari en iOS amplía la página al enfocar un campo cuya letra mida menos
     de 16 px, y los campos heredan los 15 px del body (`font: inherit`). El
     resultado es que al abrir el teclado la página se acerca y la mitad
     derecha se sale de la pantalla —y al cerrarlo no se vuelve solo: hay que
     pellizcar para deshacerlo—. Basta con llegar a 16 px, y se hace donde se
     toca con el dedo para no engordar la letra en el escritorio.

     Lo que **no** se hace es `maximum-scale=1` en el viewport, que es el otro
     remedio que circula: quita el zoom del sitio entero, incluido el de quien
     lo necesita para leer. */
  @media (pointer: coarse) {
    input, textarea { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="ola"></div>

<header>
  <img src="/perseo-avatar.jpg" alt="">
  <h1>Perseo</h1>
  <div id="conexion"><span class="punto" id="luz"></span><span class="mayus" id="texto-estado">conectando</span></div>
</header>

<nav>
  <button id="pestana-chat" aria-selected="true">Chat</button>
  <button id="pestana-cola" aria-selected="false">Cola <span class="cuenta" id="contador"></span></button>
  <button id="pestana-correo" aria-selected="false">Correo</button>
  <button id="pestana-memoria" aria-selected="false">Memoria</button>

<main>
  <section id="chat">
    <div id="chat-lectura">
      <span class="latido"></span>
      <span>Perseo · canal de texto</span>
      <button id="borrar-chat" type="button" title="Borrar esta conversación">Borrar</button>
    </div>
  </section>

    <div class="filtros" id="modos-memoria">

<form id="escribir">
  <input id="entrada" placeholder="Escribe a Perseo…" autocomplete="off" enterkeyhint="send">
  <button type="submit">Enviar</button>
</form>

<div id="puerta">
  <div class="cara">
    <span class="onda"></span><span class="onda b"></span><span class="onda c"></span>
    <img src="/perseo-avatar.jpg" alt="">
  </div>
  <h1>Perseo</h1>
  <p>Pega el token del núcleo. Está en <code>perseo_core/datos/token.txt</code>.</p>
  <form id="entrar">
    <input id="token" type="password" placeholder="Token" autocomplete="current-password">
    <button type="submit">Entrar</button>
  </form>
  <div class="error" id="error-puerta"></div>
</div>

<script>
"use strict";

// El token solo viaja una vez, a POST /sesion, que lo canjea por una cookie
// HttpOnly. A partir de ahí el navegador la manda sola y EventSource —que no
// admite cabeceras propias— queda autenticado sin meter nada en la URL.
const $ = (id) => document.getElementById(id);
const puerta = $("puerta");
const chat = $("chat");
const cola = $("cola");
const correo = $("correo");
const panel = $("estado");
const luz = $("luz");
const textoEstado = $("texto-estado");

const ESTADOS_ABIERTOS = new Set(["pendiente", "en_curso", "esperando"]);

//: Cada cuánto se repregunta por el estado mientras esa pestaña está delante.
//: No se refresca si no se está mirando: cada vuelta sondea Ollama y el plugin
//: de Obsidian, y hacerlo con la pantalla apagada solo gasta batería.
const REFRESCO_ESTADO = 20000;

//: Cuántas notas de una búsqueda se enseñan dentro de la tarjeta de su trabajo.
//: El resto se cuenta y se deja para la pestaña de Memoria.
const NOTAS_EN_LA_COLA = 3;

let flujo = null;
let pestana = "chat";
let temporizadorEstado = null;
let ultimosTrabajos = [];

// --------------------------------------------------------------------- //
// Utilidades
// --------------------------------------------------------------------- //

function crear(etiqueta, clase, texto) {
  const nodo = document.createElement(etiqueta);
  if (clase) nodo.className = clase;
  if (texto !== undefined) nodo.textContent = texto;
  return nodo;
}

function duracion(segundos) {
  const d = Math.floor(segundos / 86400);
  const h = Math.floor((segundos % 86400) / 3600);
  const m = Math.floor((segundos % 3600) / 60);
  if (d) return `${d} d ${h} h`;
  if (h) return `${h} h ${m} min`;
  return `${m} min`;
}

// --------------------------------------------------------------------- //
// Acceso
// --------------------------------------------------------------------- //

async function abrirSesion(token) {
  const r = await fetch("/sesion", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token },
  });
  if (!r.ok) throw new Error("Token incorrecto");
}

async function hayCookie() {
  // /trabajos exige token; si contesta, la cookie sigue viva.
  try {
    const r = await fetch("/trabajos?limite=1");
    return r.ok;
  } catch { return false; }
}

$("entrar").addEventListener("submit", async (e) => {
  e.preventDefault();
  const error = $("error-puerta");
  error.textContent = "";
  try {
    await abrirSesion($("token").value.trim());
    $("token").value = "";
    empezar();
  } catch (err) {
    error.textContent = err.message;
  }
});

// --------------------------------------------------------------------- //
// Pestañas
// --------------------------------------------------------------------- //

const SECCIONES = { chat, cola, correo, memoria: $("memoria"), estado: panel };

function mostrar(cual) {
  pestana = cual;
  for (const [nombre, seccion] of Object.entries(SECCIONES)) {
    seccion.hidden = nombre !== cual;
    $("pestana-" + nombre).setAttribute("aria-selected", String(nombre === cual));
  }
  // El campo de escribir solo tiene sentido en el chat; en el móvil, además,
  // ocupa el sitio de dos tarjetas.
  $("escribir").style.display = cual === "chat" ? "flex" : "none";

  clearInterval(temporizadorEstado);
  if (cual === "estado") {
    cargarEstado();
    temporizadorEstado = setInterval(cargarEstado, REFRESCO_ESTADO);
  } else if (cual === "cola" || cual === "correo") {
    cargarCola();
  } else if (cual === "memoria") {
    modoMemoria($("anotar-memoria").hidden ? "buscar" : "anotar", false);
  }
}
for (const nombre of Object.keys(SECCIONES)) {
  $("pestana-" + nombre).addEventListener("click", () => mostrar(nombre));
}

// --------------------------------------------------------------------- //
// Chat
// --------------------------------------------------------------------- //

//: Dónde se guarda la conversación entre visitas, y cuánta.
const CHAT_GUARDADO = "perseo.chat";
const MENSAJES_GUARDADOS = 60;

//: Cada cuánto se pregunta por un trabajo encolado, y cuánto se espera antes de
//: darlo por largo y dejar de mirar. Diez minutos: lo que tarda el agente `dev`
//: en lo suyo. Pasado eso, el trabajo sigue vivo en la Cola; lo que se acaba es
//: la vigilancia desde aquí.
const MS_ENTRE_SONDEOS = 2000;
const MS_ESPERANDO_TRABAJO = 10 * 60 * 1000;

//: Un mensaje que tarde más que esto es un mensaje que no va a llegar. Sin
//: plazo, un `fetch` colgado deja la burbuja de «pensando» girando para siempre.
const MS_TOPE_ENVIO = 45000;

let conversacion = [];

function guardarConversacion() {
  try {
    localStorage.setItem(CHAT_GUARDADO, JSON.stringify(conversacion.slice(-MENSAJES_GUARDADOS)));
  } catch (e) {
    // Modo privado, cuota llena: perder el historial no puede romper el chat.
  }
}

function hora(momento) {
  return new Date(momento ?? Date.now()).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
}

/** Pinta un mensaje. `recordar` es falso al restaurar, o se guardaría dos veces. */
function decir(texto, clase, opciones = {}) {
  const { momento = Date.now(), recordar = true } = opciones;
  const esBurbuja = clase.startsWith("burbuja");

  if (esBurbuja) {
    const lado = clase.includes("mio") ? "mio" : "suyo";
    const turno = crear("div", "turno " + lado);
    turno.appendChild(crear("span", null, lado === "mio" ? "Señor Persus" : "Perseo"));
    turno.appendChild(crear("span", "hora", hora(momento)));
    chat.appendChild(turno);
  }

  const div = crear("div", clase, texto);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  if (recordar) {
    conversacion.push({ texto, clase, momento });
    guardarConversacion();
  }
  return div;
}

/** Restaura lo que se dijo la última vez.
 *
 *  Antes, cerrar la pestaña era perder la conversación entera: las burbujas
 *  vivían en el DOM y en ningún otro sitio. Guardarlo en el navegador y no en el
 *  núcleo es a propósito — el chat del móvil es una libreta, no un expediente—,
 *  y por eso hay un botón para borrarlo. */
function restaurarConversacion() {
  try {
    conversacion = JSON.parse(localStorage.getItem(CHAT_GUARDADO) ?? "[]");
  } catch (e) {
    conversacion = [];
  }
  if (!Array.isArray(conversacion)) conversacion = [];

  for (const m of conversacion) {
    decir(m.texto, m.clase, { momento: m.momento, recordar: false });
  }
  if (conversacion.length) {
    decir("— arriba, lo de antes —", "nota", { recordar: false });
  }
}

/** Los tres puntos mientras Perseo piensa. Devuelve cómo quitarlos. */
function pensando() {
  const caja = crear("div", "burbuja suyo pensando");
  for (let i = 0; i < 3; i++) caja.appendChild(crear("span"));
  chat.appendChild(caja);
  chat.scrollTop = chat.scrollHeight;
  return () => caja.remove();
}

/** Un `fetch` con plazo. Sin esto, una petición que no vuelve deja la burbuja de
 *  «pensando» girando hasta que alguien recarga. */
async function conPlazo(url, opciones, ms) {
  const corte = new AbortController();
  const reloj = setTimeout(() => corte.abort(), ms);
  try {
    return await fetch(url, { ...opciones, signal: corte.signal });
  } finally {
    clearTimeout(reloj);
  }
}

/** El resultado de un trabajo, en una línea que se pueda leer en una burbuja.
 *
 *  Las mismas reglas que en la cola, y por el mismo motivo (H-36): una nota
 *  entera son doce mil caracteres para decir que se leyó un fichero, y un
 *  triaje volcado en JSON es ilegible justo donde se mira con prisa. */
function resumirResultado(resultado) {
  if (resultado == null) return "Hecho.";
  if (typeof resultado === "string") return resultado;
  if (typeof resultado.contenido === "string") {
    return `Leída ${resultado.ruta ?? ""} — ${resultado.contenido.length} caracteres`;
  }
  if (Array.isArray(resultado.notas)) {
    const titular = resultado.titular ?? `${resultado.notas.length} nota(s)`;
    return `${titular} — se leen en Memoria`;
  }
  if (Array.isArray(resultado.clasificados)) {
    return resultado.titular ?? `${resultado.clasificados.length} correos triados`;
  }
  if (resultado.titular || resultado.texto) return resultado.titular ?? resultado.texto;
  // Lo que no se sepa resumir sale como pares, nunca como JSON en crudo: es la
  // misma decisión que tomó el panel del PC (H-52).
  const pares = Object.entries(resultado)
    .filter(([, v]) => v !== null && typeof v !== "object")
    .map(([k, v]) => `${k}: ${v}`);
  return pares.length ? pares.join(" · ") : "Hecho.";
}

//: Los trabajos que el chat está siguiendo por su cuenta. El flujo de eventos
//: avisa de todo lo que termina, y para estos ya se ha escrito la respuesta
//: entera: sin esto, cada pregunta dejaba la contestación y, debajo, un
//: «Trabajo #N terminado» que no añadía nada.
const siguiendo = new Set();

/** Sigue un trabajo encolado y trae su respuesta **al chat**.
 *
 *  Antes esto se quedaba en «Encargado — trabajo #N» y la respuesta aparecía
 *  solo en la pestaña Cola, así que preguntar algo que daba trabajo y leer la
 *  contestación eran dos pantallas distintas. Se sigue encolando igual —la cara
 *  no piensa— pero el resultado vuelve a donde se preguntó. */
async function seguirTrabajo(id) {
  const hasta = Date.now() + MS_ESPERANDO_TRABAJO;
  const quitar = pensando();
  siguiendo.add(id);
  try {
    while (Date.now() < hasta) {
      await new Promise(r => setTimeout(r, MS_ENTRE_SONDEOS));
      let t;
      try {
        const r = await fetch(`/trabajos/${id}`);
        if (r.status === 401) { puerta.style.display = "flex"; return; }
        if (!r.ok) continue;
        t = await r.json();
      } catch (e) {
        continue;  // un corte de red no cancela el trabajo, que vive en el núcleo
      }

      if (t.estado === "hecho") {
        decir(resumirResultado(t.resultado), "burbuja suyo");
        cargarCola();
        return;
      }
      if (t.estado === "fallido" || t.estado === "cancelado" || t.estado === "rechazado") {
        decir(`El trabajo #${id} acabó ${t.estado}: ${t.error ?? "sin detalle"}`, "nota");
        cargarCola();
        return;
      }
      if (t.estado === "esperando") {
        decir(`El trabajo #${id} espera un sí. Se aprueba en la Cola.`, "nota");
        cargarCola();
        return;
      }
    }
    decir(`El trabajo #${id} sigue en marcha. Se ve en la Cola.`, "nota");
  } finally {
    quitar();
    // Se deja de seguir aquí y no antes: mientras se siga, el flujo de eventos
    // calla, y si se soltara al primer aviso volverían los dos mensajes.
    siguiendo.delete(id);
  }
}

$("escribir").addEventListener("submit", async (e) => {
  e.preventDefault();
  const entrada = $("entrada");
  const texto = entrada.value.trim();
  if (!texto) return;
  entrada.value = "";
  decir(texto, "burbuja mio");

  const quitar = pensando();
  try {
    const r = await conPlazo("/mensaje", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto, origen: "texto" }),
    }, MS_TOPE_ENVIO);
    if (r.status === 401) { puerta.style.display = "flex"; return; }
    const datos = await r.json();
    if (datos.destino === "responder") {
      decir(datos.respuesta || "(sin respuesta)", "burbuja suyo");
    } else {
      // Se encola, como siempre —la cara no piensa—, pero desde aquí se mira
      // hasta que termine y la respuesta vuelve a esta misma pantalla.
      decir(`Encargado — trabajo #${datos.trabajo.id} (${datos.trabajo.agente})`, "nota");
      cargarCola();
      seguirTrabajo(datos.trabajo.id);
    }
  } catch (err) {
    const motivo = err.name === "AbortError"
      ? `Perseo no contestó en ${Math.round(MS_TOPE_ENVIO / 1000)}s. Mira la Cola o inténtalo otra vez.`
      : "No se pudo enviar: " + err.message;
    decir(motivo, "nota");
  } finally {
    quitar();
  }
});

$("borrar-chat").addEventListener("click", () => {
  conversacion = [];
  guardarConversacion();
  // La cabecera se queda: es parte de la pantalla, no de la conversación.
  for (const nodo of [...chat.children]) {
    if (nodo.id !== "chat-lectura") nodo.remove();
  }
});

/** El hueco que deja el teclado del móvil.
 *
 *  El teclado del iPhone **no encoge la página**: la tapa. Así que el campo de
 *  escribir se queda debajo y la conversación larga se escribe a ciegas. Lo
 *  único que sabe cuánto mide el teclado es `visualViewport`, y de ahí sale la
 *  variable que el CSS usa como relleno. */
if (window.visualViewport) {
  const ajustar = () => {
    const tapado = Math.max(0, window.innerHeight - visualViewport.height - visualViewport.offsetTop);
    document.documentElement.style.setProperty("--teclado", `${Math.round(tapado)}px`);
    if (tapado > 0) chat.scrollTop = chat.scrollHeight;
  };
  visualViewport.addEventListener("resize", ajustar);
  visualViewport.addEventListener("scroll", ajustar);
}

// --------------------------------------------------------------------- //
// Cola
// --------------------------------------------------------------------- //

// Cómo se llama cada cajón del triaje por pantalla. El del modelo es para el
// código; este es para alguien que mira el móvil con prisa.
const CLASES_CORREO = {
  requiere_accion: "acción",
  interesante: "interesante",
  no_seguro: "sin decidir",
  ignorar: "ignorar",
};

function resumirPeticion(t) {
  // Un trabajo de correo trae el lote entero dentro de la petición. Volcarlo
  // llena la pantalla del JSON de veinte correos antes de llegar al resultado.
  const mensajes = t.peticion?.mensajes;
  if (Array.isArray(mensajes)) {
    return `${mensajes.length} correo${mensajes.length === 1 ? "" : "s"} del buzón`;
  }
  return t.peticion?.texto ?? t.peticion?.accion ?? JSON.stringify(t.peticion);
}

// Qué se ha hecho con cada correo, por id. Lo que no esté aquí está pendiente:
// es el mismo criterio que en el almacén, y así una pantalla vieja no inventa
// estados que el núcleo no tiene.
let marcadosCorreo = {};

async function cargarMarcados() {
  try {
    marcadosCorreo = (await (await fetch("/correos")).json()).marcados ?? {};
  } catch {
    // Sin esto se pierden las marcas, no los correos: se pintan todos como
    // pendientes, que es lo que eran antes de que esto existiera.
    marcadosCorreo = {};
  }
}

async function marcarCorreo(id, estado) {
  const r = await fetch(`/correos/${encodeURIComponent(id)}/estado`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ estado }),
  });
  if (!r.ok) return;
  if (estado === "pendiente") delete marcadosCorreo[id];
  else marcadosCorreo[id] = estado;
  pintarPestanaCorreo();
}

function lineaCorreo(c, conAcciones = false) {
  const estado = marcadosCorreo[c.id];
  const linea = crear("div", "correo" + (estado ? " resuelto" : ""));
  const clase = crear("span", "clase " + (c.clase ?? ""), CLASES_CORREO[c.clase] ?? c.clase ?? "?");
  linea.append(clase, ` ${c.remitente ?? "?"} — `);
  linea.appendChild(crear("span", "asunto", c.asunto ?? "(sin asunto)"));
  if (c.motivo) linea.appendChild(crear("div", "motivo", c.motivo));

  // En la cola las líneas de correo son el resultado de un trabajo —lo que
  // pasó—, y ahí no se decide nada. Se decide en la pestaña de Correo.
  if (conAcciones && c.id) {
    const acciones = crear("div", "acciones");
    if (estado) {
      acciones.appendChild(crear("span", "motivo",
        estado === "atendido" ? "Atendido" : "Descartado"));
      const volver = crear("button", null, "Reabrir");
      volver.addEventListener("click", () => marcarCorreo(c.id, "pendiente"));
      acciones.appendChild(volver);
    } else {
      const hecho = crear("button", "hecho", "Hecho");
      hecho.addEventListener("click", () => marcarCorreo(c.id, "atendido"));
      const fuera = crear("button", null, "Descartar");
      fuera.addEventListener("click", () => marcarCorreo(c.id, "descartado"));
      acciones.append(hecho, fuera);
    }
    linea.appendChild(acciones);
  }
  return linea;
}

function pintarCorreos(destino, resultado) {
  destino.appendChild(crear("div", null, resultado.titular ?? "Nada que destacar"));

  // Lo ignorable no se pinta aquí: si el triaje acierta, es casi todo, y taparía
  // lo único que se ha venido a mirar. Está entero en la pestaña de Correo.
  for (const c of resultado.clasificados) {
    if (c.clase === "ignorar") continue;
    destino.appendChild(lineaCorreo(c));
  }
}

function pintarTrabajo(t) {
  const div = crear("div", "tarjeta");
  div.dataset.id = t.id;

  const cabeza = crear("div", "cabeza");
  cabeza.append(crear("span", "etiqueta " + t.estado, t.estado), ` #${t.id} · ${t.agente} · ${t.origen}`);
  div.appendChild(cabeza);

  // `texto` y `accion` son los campos que usan los agentes de hoy. El JSON en
  // crudo es el respaldo: feo, pero deja ver qué se pidió en vez de nada.
  div.appendChild(crear("div", "cuerpo", resumirPeticion(t)));

  if (t.resultado || t.error) {
    const extra = crear("div", "resultado");
    if (t.error) {
      extra.textContent = "Error: " + t.error;
    } else if (Array.isArray(t.resultado?.notas)) {
      // Lo mismo que con el triaje: "3 nota(s) sobre «X»" no dice cuáles, y una
      // búsqueda que no enseña lo que encontró no sirve de nada. Pero aquí van
      // acotadas: diez notas dentro de una tarjeta de la cola empujan hacia
      // abajo todo lo demás, y esta pestaña es para ver el trabajo, no para leer.
      extra.appendChild(crear("div", null, t.resultado.titular ?? "Sin resultados"));
      for (const n of t.resultado.notas.slice(0, NOTAS_EN_LA_COLA)) {
        extra.appendChild(pintarNota(n));
      }
      const resto = t.resultado.notas.length - NOTAS_EN_LA_COLA;
      if (resto > 0) {
        extra.appendChild(crear("div", "motivo", `y ${resto} más — búscalas en Memoria`));
      }
    } else if (Array.isArray(t.resultado?.clasificados)) {
      // El triaje es lo único que se mira desde el móvil con prisa: llega un
      // aviso que solo cuenta —"1 requiere acción"— y esta pantalla es donde se
      // ve de quién. Volcarlo como JSON lo hacía ilegible justo aquí.
      pintarCorreos(extra, t.resultado);
    } else if (typeof t.resultado?.contenido === "string") {
      // Leer una nota devuelve la nota entera. Volcarla aquí llena la cola con
      // doce mil caracteres de Markdown para decir que se leyó un fichero: es el
      // mismo error que H-36, con otro agente. El contenido se lee en Memoria.
      extra.textContent =
        `Leída ${t.resultado.ruta ?? ""} — ${t.resultado.contenido.length} caracteres`;
    } else {
      extra.textContent = t.resultado?.titular ?? t.resultado?.texto ?? JSON.stringify(t.resultado);
    }
    div.appendChild(extra);
  }

  if (t.estado === "esperando" && t.confirmacion) {
    const pregunta = crear("div", "pregunta");
    pregunta.appendChild(crear("div", null, t.confirmacion.resumen ?? "¿Confirmas?"));
    if (t.confirmacion.detalle) {
      pregunta.appendChild(crear("div", "detalle", t.confirmacion.detalle));
    }
    div.appendChild(pregunta);
  }

  if (ESTADOS_ABIERTOS.has(t.estado)) {
    const acciones = crear("div", "acciones");

    // Contestar desde dos sitios a la vez (esta pantalla y el móvil) es normal.
    // El núcleo resuelve el empate y devuelve 409 al segundo; aquí basta con
    // recargar la cola para ver lo que quedó.
    const responder = async (ruta) => {
      for (const otro of acciones.children) otro.disabled = true;
      const r = await fetch(`/trabajos/${t.id}/${ruta}`, { method: "POST" });
      if (r.status === 409) decir(`El trabajo #${t.id} ya estaba resuelto.`, "nota");
      cargarCola();
    };

    if (t.estado === "esperando") {
      const si = crear("button", "pildora aprobar", "Aprobar");
      si.addEventListener("click", () => responder("aprobar"));
      const no = crear("button", "pildora peligro", "Rechazar");
      no.addEventListener("click", () => responder("rechazar"));
      acciones.append(si, no);
    }

    const cancelar = crear("button", "pildora peligro", "Cancelar");
    cancelar.addEventListener("click", () => responder("cancelar"));
    acciones.appendChild(cancelar);

    div.appendChild(acciones);
  }
  return div;
}

async function cargarCola() {
  let datos;
  try {
    const r = await fetch("/trabajos?limite=50");
    if (r.status === 401) { puerta.style.display = "flex"; return; }
    datos = await r.json();
  } catch { return; }

  ultimosTrabajos = datos.trabajos;
  pintarCola();

  const abiertos = datos.trabajos.filter((t) => ESTADOS_ABIERTOS.has(t.estado)).length;
  $("contador").textContent = abiertos ? `(${abiertos})` : "";

  // Las marcas viajan aparte de los trabajos: el triaje dice de qué va cada
  // correo y esto dice qué has hecho con él. Se piden juntas para que la
  // pestaña no parpadee entre lo uno y lo otro.
  await cargarMarcados();
  pintarPestanaCorreo();
}

// Qué se enseña de la cola. `todo` no es un filtro: es no filtrar.
// El filtro se aplica **aquí y no en la petición** para que cambiarlo sea
// instantáneo: los cincuenta últimos ya están en memoria, y pedirlos otra vez
// por el túnel de Tailscale se nota en el móvil.
const FILTROS = {
  todo: () => true,
  abiertos: (t) => ESTADOS_ABIERTOS.has(t.estado),
  esperando: (t) => t.estado === "esperando",
  mios: (t) => t.origen !== "disparador",
  solos: (t) => t.origen === "disparador",
  fallidos: (t) => t.estado === "fallido",
};

const NOMBRES_FILTRO = {
  todo: "todo",
  abiertos: "abiertos",
  esperando: "esperan un sí",
  mios: "los pedí yo",
  solos: "salieron solos",
  fallidos: "fallidos",
};

let filtroCola = "todo";

function pintarCola() {
  cola.replaceChildren();

  const barra = crear("div", "filtros");
  for (const clave of Object.keys(FILTROS)) {
    const cuantos = ultimosTrabajos.filter(FILTROS[clave]).length;
    const boton = crear("button", "filtro", `${NOMBRES_FILTRO[clave]} ${cuantos}`);
    boton.setAttribute("aria-pressed", String(clave === filtroCola));
    boton.addEventListener("click", () => { filtroCola = clave; pintarCola(); });
    barra.appendChild(boton);
  }
  cola.appendChild(barra);

  const visibles = ultimosTrabajos.filter(FILTROS[filtroCola]);
  if (!visibles.length) {
    cola.appendChild(crear("div", "nota",
      filtroCola === "todo" ? "No hay nada en la cola." : "Nada con ese filtro."));
    return;
  }
  for (const t of visibles) cola.appendChild(pintarTrabajo(t));
}

// --------------------------------------------------------------------- //
// Correo
// --------------------------------------------------------------------- //

// El orden en que se leen los cajones: primero lo que hay que hacer, y lo
// ignorable al final y plegado. Es el orden de urgencia, no el del modelo.
const ORDEN_CAJONES = ["requiere_accion", "no_seguro", "interesante", "ignorar"];

function pintarPestanaCorreo() {
  correo.replaceChildren();

  const cajones = new Map(ORDEN_CAJONES.map((c) => [c, []]));
  let triados = 0;
  for (const t of ultimosTrabajos) {
    for (const c of t.resultado?.clasificados ?? []) {
      (cajones.get(c.clase) ?? cajones.get("no_seguro")).push({ ...c, trabajo: t.id });
      triados += 1;
    }
  }

  if (!triados) {
    correo.appendChild(crear("div", "nota",
      "Todavía no hay ningún correo triado. Sale solo cuando el disparador mira el buzón."));
    return;
  }

  // La cifra grande es lo que queda por hacer, no lo que llegó: un contador que
  // nunca baja deja de mirarse a la semana.
  const resumen = crear("div", "cifras");
  for (const cajon of ORDEN_CAJONES) {
    const todos = cajones.get(cajon);
    const pendientes = todos.filter((c) => !marcadosCorreo[c.id]).length;
    const cifra = crear("div", "cifra");
    cifra.appendChild(crear("b", null, String(pendientes)));
    cifra.appendChild(crear("span", "mayus", CLASES_CORREO[cajon]));
    if (pendientes !== todos.length) {
      cifra.appendChild(crear("div", "motivo", `de ${todos.length}`));
    }
    resumen.appendChild(cifra);
  }
  correo.appendChild(resumen);

  for (const cajon of ORDEN_CAJONES) {
    const correos = cajones.get(cajon);
    if (!correos.length) continue;

    const tarjeta = crear("div", "tarjeta");
    const cabeza = crear("div", "cabeza");
    cabeza.append(crear("span", "clase " + cajon, CLASES_CORREO[cajon]), ` ${correos.length}`);
    tarjeta.appendChild(cabeza);

    // Lo ignorable va plegado: ocupa casi todo y no se viene a mirar, pero
    // esconderlo del todo es lo que impide comprobar que el triaje no se está
    // comiendo nada. Plegado son las dos cosas.
    const destino = cajon === "ignorar"
      ? tarjeta.appendChild(crear("details"))
      : tarjeta;
    if (cajon === "ignorar") {
      destino.appendChild(crear("summary", null, "ver los ignorados"));
    }
    // Lo resuelto al fondo del cajón, sin desaparecer.
    const ordenados = [...correos].sort(
      (a, b) => (marcadosCorreo[a.id] ? 1 : 0) - (marcadosCorreo[b.id] ? 1 : 0)
    );
    for (const c of ordenados) destino.appendChild(lineaCorreo(c, true));

    correo.appendChild(tarjeta);
  }
}

// Memoria
// --------------------------------------------------------------------- //

// Buscar es encolar un trabajo para el agente `memoria`, como todo lo demás: no
// hay una ruta que busque en el vault, y no la hay a propósito. Por HTTP se
// encolan trabajos, no se ejecutan herramientas.
async function encolarYEsperar(peticion, agente, segundos = 20) {
  const r = await fetch("/trabajos", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ agente, peticion, origen: "texto" }),
  });
  if (r.status === 401) { puerta.style.display = "flex"; return null; }
  const trabajo = await r.json();

  // Se sondea en vez de escuchar el flujo: el evento llega igual, pero aquí hace
  // falta el resultado del trabajo concreto y no enterarse de que algo cambió.
  const limite = Date.now() + segundos * 1000;
  while (Date.now() < limite) {
    await new Promise((r) => setTimeout(r, 400));
    const actual = await (await fetch(`/trabajos/${trabajo.id}`)).json();
    if (actual.estado === "hecho") return actual.resultado;
    if (["fallido", "cancelado", "rechazado"].includes(actual.estado)) {
      throw new Error(actual.error || `El trabajo quedó ${actual.estado}`);
    }
  }
  throw new Error("Sigue en marcha; míralo en la cola.");
}

function pintarNota(n) {
  const caja = crear("details", "tarjeta nota-vault");
  const titulo = crear("summary", null, n.titulo || n.ruta || "(sin título)");
  caja.appendChild(titulo);
  if (n.ruta) caja.appendChild(crear("div", "ruta", n.ruta));
  if (n.extracto) caja.appendChild(crear("div", "extracto", n.extracto));

  // La nota entera se pide solo al abrirla: una búsqueda devuelve diez, y
  // traerlas enteras por el túnel para leer una es tirar el ancho de banda.
  let traida = false;
  caja.addEventListener("toggle", async () => {
    if (!caja.open || traida || !n.ruta) return;
    traida = true;
    const cuerpo = crear("div", "contenido", "Leyendo…");
    caja.appendChild(cuerpo);
    try {
      const r = await encolarYEsperar({ accion: "leer", ruta: n.ruta }, "memoria");
      cuerpo.textContent = r?.contenido ?? "(vacía)";
    } catch (e) {
      cuerpo.textContent = "No se pudo leer: " + e.message;
      traida = false;
    }
  });
  return caja;
}

// `limpiar` va aparte porque volver a la pestaña no es lo mismo que cambiar de
// modo: al volver interesa seguir viendo lo que buscaste, y al cambiar de modo
// el resultado de antes ya no viene a cuento.
function modoMemoria(cual, limpiar = true) {
  const buscando = cual === "buscar";
  $("buscar-memoria").hidden = !buscando;
  $("anotar-memoria").hidden = buscando;
  $("modo-buscar").setAttribute("aria-pressed", String(buscando));
  $("modo-anotar").setAttribute("aria-pressed", String(!buscando));
  if (limpiar) $("notas").replaceChildren();
  (buscando ? $("consulta") : $("titulo-nota")).focus();
}
$("modo-buscar").addEventListener("click", () => modoMemoria("buscar"));
$("modo-anotar").addEventListener("click", () => modoMemoria("anotar"));

// Anotar nunca sobrescribe: si la nota existe, el agente le añade una sección
// con la fecha. Es la regla del vault y aquí no hay ningún botón que la salte —
// tampoco hay forma de borrar desde esta pantalla, y es a propósito.
$("anotar-memoria").addEventListener("submit", async (e) => {
  e.preventDefault();
  const titulo = $("titulo-nota").value.trim();
  const texto = $("texto-nota").value.trim();
  const destino = $("notas");
  if (!titulo || !texto) {
    destino.replaceChildren(crear("div", "nota", "Hacen falta un título y un texto."));
    return;
  }

  const boton = $("anotar-memoria").querySelector("button");
  boton.disabled = true;
  destino.replaceChildren(crear("div", "nota", "Anotando…"));
  try {
    const resultado = await encolarYEsperar({ accion: "anotar", titulo, texto }, "memoria");
    if (resultado === null) return;
    $("titulo-nota").value = "";
    $("texto-nota").value = "";
    destino.replaceChildren(crear("div", "nota", resultado?.titular ?? "Anotado."));
  } catch (err) {
    // El texto no se borra si falla: es lo que acabas de escribir, y perderlo
    // por un núcleo que no contestó sería la peor forma de estrenar esto.
    destino.replaceChildren(crear("div", "nota", "No se pudo anotar: " + err.message));
  } finally {
    boton.disabled = false;
  }
});

$("buscar-memoria").addEventListener("submit", async (e) => {
  e.preventDefault();
  const texto = $("consulta").value.trim();
  if (!texto) return;

  const destino = $("notas");
  destino.replaceChildren(crear("div", "nota", `Buscando «${texto}»…`));
  try {
    const resultado = await encolarYEsperar({ accion: "buscar", texto }, "memoria");
    if (resultado === null) return;
    const notas = resultado?.notas ?? [];
    destino.replaceChildren();
    if (!notas.length) {
      // Con el plugin de Obsidian la búsqueda es literal y no dobla tildes: es
      // la diferencia de comportamiento entre los dos respaldos, y aquí es donde
      // se nota. Decirlo evita pensar que la nota no existe.
      destino.appendChild(crear("div", "nota",
        `Ninguna nota con «${texto}». Si el vault va por el plugin de Obsidian, la búsqueda es literal: prueba con tildes.`));
      return;
    }
    destino.appendChild(crear("div", "mayus", `${notas.length} nota(s)`));
    for (const n of notas) destino.appendChild(pintarNota(n));
  } catch (err) {
    destino.replaceChildren(crear("div", "nota", "No se pudo buscar: " + err.message));
  }
});

function pintarCuota(cuota) {
  const tarjeta = crear("div", "tarjeta");
  tarjeta.appendChild(crear("div", "cabeza", `Cuota de hoy · ${cuota.dia}`));

  if (!cuota.servicios.length) {
    tarjeta.appendChild(crear("div", "detalle", "Nadie ha llamado a ningún modelo de fuera."));
  }
  for (const s of cuota.servicios) {

/** Una barra de las de toda la vida, con su número al lado.
 *  En 375 px una rejilla de medidores no se lee: aquí las barras van en fila y
 *  ocupan el ancho, que es lo que sí se mira de un vistazo en el móvil. */
function barra(etiqueta, porcentaje, detalle) {
  const fila = crear("div", "medida");
  const cabeza = crear("div", "medida-cabeza");
  cabeza.append(crear("span", "mayus", etiqueta), crear("span", null, `${Math.round(porcentaje)}%`));
  fila.appendChild(cabeza);

  const carril = crear("div", "carril");
  const relleno = crear("div", "relleno" + (porcentaje >= 90 ? " malo" : porcentaje >= 70 ? " aviso" : ""));
  relleno.style.width = `${Math.min(100, Math.max(0, porcentaje))}%`;
  carril.appendChild(relleno);
  fila.appendChild(carril);

  if (detalle) fila.appendChild(crear("div", "motivo", detalle));
  return fila;
}

/** Lo que un asistente debería saber sin que se lo preguntes. Va lo primero
 *  porque es lo único de esta pantalla que cambia lo que haces ahora. */
function pintarPresencia(p) {
  const tarjeta = crear("div", "tarjeta hud");
  tarjeta.appendChild(crear("div", "cabeza", "Ahora mismo"));

  const lineas = [];
  lineas.push(p.haciendo
    ? `Trabajando: #${p.haciendo.id} · ${p.haciendo.agente}`
    : "Sin nada entre manos");
  if (p.esperando_un_si) lineas.push(`${p.esperando_un_si} esperando un sí`);

  // El correo y la agenda se cuentan en «El día», justo debajo: repetirlos aquí
  // era la misma frase dos veces en la misma pantalla.
  for (const linea of lineas) tarjeta.appendChild(crear("div", "detalle", linea));
  return tarjeta;
}

/** El día: la agenda de las próximas horas y el correo que nadie ha resuelto.
 *
 *  Los dos datos ya estaban en el sistema —en el calendario y en el triaje— y
 *  había que ir a buscarlos a dos sitios distintos. */
function pintarElDia(p) {
  const tarjeta = crear("div", "tarjeta hud");
  tarjeta.appendChild(crear("div", "cabeza", "El día"));

  const eventos = p.eventos?.length ? p.eventos : (p.proximo_evento ? [p.proximo_evento] : []);
  if (eventos.length) {
    for (const e of eventos) {
      const fila = crear("div", "cita");
      const hora = e.momento
        ? new Date(e.momento).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })
        : "--:--";
      fila.appendChild(crear("span", "cita-hora", hora));
      fila.appendChild(crear("span", "cita-titulo", e.titulo ?? "(sin título)"));
      tarjeta.appendChild(fila);
    }
  } else {
    tarjeta.appendChild(crear("div", "detalle", "Nada en la agenda de las próximas 24 h."));
  }

  const pendientes = Object.entries(p.correo ?? {});
  const total = pendientes.reduce((n, [, c]) => n + c, 0);
  const accion = p.correo?.requiere_accion ?? 0;
  tarjeta.appendChild(crear("div", "detalle separado",
    total
      ? `${total} correo${total === 1 ? "" : "s"} sin resolver` + (accion ? ` · ${accion} requieren acción` : "")
      : "Correo al día"));
  return tarjeta;
}

/** Una magnitud en el tiempo, dibujada a mano en SVG.
 *
 *  Un número dice si la CPU está alta **ahora**; la línea dice si lleva diez
 *  minutos así, que es la pregunta que uno se hace de verdad. El eje va de 0 a
 *  100 siempre, así que dos líneas se comparan sin leer un solo número. */
function linea(etiqueta, valor, puntos) {
  const ancho = 240, alto = 34;
  // Con una sola muestra se repite el punto: una recta se entiende, y un hueco
  // en una pantalla recién abierta parece que la telemetría no va.
  const serie = puntos.length === 1 ? [puntos[0], puntos[0]] : puntos;
  const paso = serie.length > 1 ? ancho / (serie.length - 1) : ancho;
  const y = v => alto - (Math.max(0, Math.min(100, v)) / 100) * alto;
  const camino = serie.map((v, i) => `${i === 0 ? "M" : "L"}${(i * paso).toFixed(1)},${y(v).toFixed(1)}`).join(" ");

  const caja = crear("div", "linea");
  const cabeza = crear("div", "linea-cabeza");
  cabeza.appendChild(crear("span", "mayus", etiqueta));
  cabeza.appendChild(crear("span", "linea-valor", valor));
  caja.appendChild(cabeza);

  // Sin `innerHTML`: esto es un fichero servido por el núcleo y no hay ninguna
  // razón para meter cadenas en el árbol cuando el navegador sabe construirlo.
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${ancho} ${alto}`);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("aria-hidden", "true");
  const svgNS = "http://www.w3.org/2000/svg";
  // La mitad de la escala, para tener contra qué leer la línea sin ejes.
  const mitad = document.createElementNS(svgNS, "line");
  mitad.setAttribute("class", "linea-mitad");
  mitad.setAttribute("x1", 0); mitad.setAttribute("x2", ancho);
  mitad.setAttribute("y1", alto / 2); mitad.setAttribute("y2", alto / 2);
  const area = document.createElementNS(svgNS, "path");
  area.setAttribute("class", "linea-area");
  area.setAttribute("d", `${camino} L${ancho},${alto} L0,${alto} Z`);
  const trazo = document.createElementNS(svgNS, "path");
  trazo.setAttribute("class", "linea-trazo");
  trazo.setAttribute("d", camino);
  // Dónde está *ahora*: en una línea plana, sin esto no se sabe cuál es el
  // extremo vivo y cuál el viejo.
  const punta = document.createElementNS(svgNS, "circle");
  punta.setAttribute("class", "linea-punta");
  punta.setAttribute("cx", ancho);
  punta.setAttribute("cy", y(serie[serie.length - 1]));
  punta.setAttribute("r", 2);
  svg.appendChild(mitad);
  svg.appendChild(area);
  svg.appendChild(trazo);
  svg.appendChild(punta);
  caja.appendChild(svg);
  return caja;
}

/** La máquina donde vive el núcleo. Es lo único de esta pantalla que no habla
 *  de Perseo: si un día el núcleo se muda a la Raspberry, describe la Raspberry. */
function pintarMaquina(m) {
  const tarjeta = crear("div", "tarjeta hud");
  const cabeza = crear("div", "cabeza", "Máquina");
  if (m.bateria) {
    cabeza.appendChild(crear("span", "ficha",
      `${m.bateria.porcentaje}%${m.bateria.enchufado ? " · enchufada" : ""}`));
  }
  tarjeta.appendChild(cabeza);

  const medidas = crear("div", "medidas");
  medidas.appendChild(barra("CPU", m.cpu ?? 0, `${m.nucleos ?? "?"} hilos`));
  medidas.appendChild(barra("RAM", m.memoria?.porcentaje ?? 0, m.memoria?.legible));
  medidas.appendChild(barra("Disco", m.disco?.porcentaje ?? 0, m.disco?.legible));
  tarjeta.appendChild(medidas);

  const historial = Array.isArray(m.historial) ? m.historial : [];
  if (historial.length) {
    const lineas = crear("div", "lineas");
    lineas.appendChild(linea("CPU", `${Math.round(m.cpu ?? 0)}%`, historial.map(h => h.cpu)));
    lineas.appendChild(linea("RAM", `${Math.round(m.memoria?.porcentaje ?? 0)}%`, historial.map(h => h.memoria)));
    tarjeta.appendChild(lineas);
  }

  if (m.red?.legible) tarjeta.appendChild(crear("div", "motivo", "Red · " + m.red.legible));
  return tarjeta;
}

let proyectosConocidos = null;

/** Los otros proyectos. La lista sale de un fichero del disco: por aquí se
 *  manda cuál abrir, nunca qué ejecutar. */
function pintarProyectos() {
  const tarjeta = crear("div", "tarjeta");
  tarjeta.appendChild(crear("div", "cabeza", "Proyectos"));

  if (proyectosConocidos === null) {
    tarjeta.appendChild(crear("div", "motivo", "Cargando…"));
    return tarjeta;
  }
  if (!proyectosConocidos.proyectos.length) {
    tarjeta.appendChild(crear("div", "motivo",
      "Ninguno declarado. Se añaden en " + proyectosConocidos.fichero));
    return tarjeta;
  }

  const fichas = crear("div", "fichas");
  fichas.style.marginTop = "9px";
  for (const p of proyectosConocidos.proyectos) {
    const boton = crear("button", "filtro", p.nombre);
    boton.title = p.descripcion || p.destino;
    boton.addEventListener("click", async () => {
      boton.textContent = "Abriendo…";
      const r = await fetch(`/proyectos/${encodeURIComponent(p.id)}/abrir`, { method: "POST" });
      boton.textContent = r.ok ? p.nombre + " ✓" : p.nombre + " ✗";
      setTimeout(() => { boton.textContent = p.nombre; }, 2000);
    });
    fichas.appendChild(boton);
  }
  tarjeta.appendChild(fichas);
  return tarjeta;
}

async function cargarProyectos() {
  try {
    proyectosConocidos = await (await fetch("/proyectos")).json();
  } catch {
    proyectosConocidos = { proyectos: [], fichero: "(no se pudo leer)" };
  }
}

/** La línea de lectura de arriba: reloj, tiempo en pie y un punto que late.
 *
 *  No dice nada que no esté en las cifras de debajo, y aun así hace falta: es lo
 *  que convierte una pantalla de datos en un puesto encendido. */
function pintarLectura(datos) {
  const caja = crear("div", "lectura");
  caja.appendChild(crear("span", "latido"));
  caja.appendChild(crear("span", null, "Perseo // núcleo activo"));
  caja.appendChild(crear("span", "lectura-sep", "·"));
  const reloj = crear("span", null, new Date().toLocaleTimeString("es-ES", { hour12: false }));
  caja.appendChild(reloj);
  caja.appendChild(crear("span", "lectura-sep", "·"));
  caja.appendChild(crear("span", null, "en pie " + duracion(datos.encendido_segundos ?? 0)));

  // El reloj se mueve solo mientras esta pantalla esté delante. Se para al
  // cambiar de pestaña, que es cuando el nodo deja de estar en el documento.
  const tic = setInterval(() => {
    if (!caja.isConnected) { clearInterval(tic); return; }
    reloj.textContent = new Date().toLocaleTimeString("es-ES", { hour12: false });
  }, 1000);
  return caja;
}

function pintarEstado(datos) {
  panel.replaceChildren();
  panel.appendChild(pintarLectura(datos));

  // Arriba, lo que se mira de un vistazo: cuánto lleva encendido y cuánta cola
  // hay abierta. Debajo, el detalle de cada pieza.
  const resumen = crear("div", "tarjeta hud");
  const cifras = crear("div", "cifras");
  const abiertos = ["pendiente", "en_curso", "esperando"]
    .reduce((n, e) => n + (datos.trabajos[e] ?? 0), 0);
  const pares = [
    [duracion(datos.encendido_segundos), "encendido"],
    [String(abiertos), "en cola"],
    [String(datos.trabajos.esperando ?? 0), "esperan un sí"],
    [String(datos.agentes.length), "agentes"],
  ];
  for (const [valor, etiqueta] of pares) {
    const cifra = crear("div", "cifra");
    cifra.appendChild(crear("b", null, valor));
    cifra.appendChild(crear("span", "mayus", etiqueta));
    cifras.appendChild(cifra);
  }
  resumen.appendChild(cifras);
  panel.appendChild(resumen);

  panel.appendChild(pintarPresencia(datos.presencia ?? {}));
  panel.appendChild(pintarElDia(datos.presencia ?? {}));
  if (datos.maquina?.disponible) panel.appendChild(pintarMaquina(datos.maquina));
  panel.appendChild(pintarProyectos());

  const piezas = crear("div", "tarjeta");
  piezas.style.display = "flex";
  piezas.style.flexDirection = "column";
  piezas.style.gap = "14px";
  for (const p of datos.piezas) piezas.appendChild(pintarPieza(p));
  panel.appendChild(piezas);

  panel.appendChild(pintarCuota(datos.cuota));

  const disparadores = crear("div", "tarjeta");
  disparadores.appendChild(crear("div", "cabeza", "Disparadores"));
  const fichas = crear("div", "fichas");
  fichas.style.marginTop = "9px";
  for (const d of datos.disparadores) {
    const ficha = crear("span", "ficha" + (d.activo ? "" : " apagada"),
      d.activo ? `${d.nombre} · cada ${Math.round(d.intervalo / 60)} min` : `${d.nombre} · apagado`);
    fichas.appendChild(ficha);
  }
  if (!datos.disparadores.length) {
    fichas.appendChild(crear("span", "ficha apagada", "ninguno registrado"));
  }
  disparadores.appendChild(fichas);
  panel.appendChild(disparadores);

  // El interruptor de confianza vive aquí porque es la única cosa del panel que
  // se cambia, y porque su estado ya se está pintando dos centímetros más
  // arriba: verlo y poder apagarlo en el mismo sitio es lo que evita dejárselo
  // puesto sin querer.
  const confianza = datos.piezas.find((p) => p.id === "confianza");
  const acciones = crear("div", "acciones");
  const encendida = confianza?.estado === "aviso";
  const boton = crear("button", "pildora" + (encendida ? " peligro" : ""),
    encendida ? "Apagar el modo confianza" : "Confiar durante 60 min");
  boton.addEventListener("click", () => cambiarConfianza(!encendida));
  const refrescar = crear("button", "pildora", "Refrescar");
  refrescar.addEventListener("click", cargarEstado);
  acciones.append(boton, refrescar);
  panel.appendChild(acciones);

  const malas = datos.piezas.filter((p) => p.estado === "malo").length;
  $("alertas").textContent = malas ? `(${malas})` : "";
}

async function cargarEstado() {
  try {
    const r = await fetch("/estado");
    if (r.status === 401) { puerta.style.display = "flex"; return; }
    // La lista de proyectos sale de un fichero que casi nunca cambia: se pide
    // una vez y se guarda, en vez de en cada refresco de la pantalla.
    if (proyectosConocidos === null) await cargarProyectos();
    pintarEstado(await r.json());
  } catch (err) {
    panel.replaceChildren(crear("div", "nota", "No se pudo leer el estado: " + err.message));
  }
}

// --------------------------------------------------------------------- //
// Flujo de eventos
// --------------------------------------------------------------------- //

function conectarEventos() {
  if (flujo) flujo.close();
  flujo = new EventSource("/eventos");

  flujo.onopen = () => {
    luz.className = "punto viva";
    textoEstado.textContent = "conectado";
  };

  flujo.onerror = () => {
    luz.className = "punto rota";
    textoEstado.textContent = "sin conexión";
    // EventSource reintenta solo; no se cierra a mano para no perder eso.
  };

  flujo.onmessage = (e) => {
    let evento;
    try { evento = JSON.parse(e.data); } catch { return; }

    if (evento.tipo === "mensaje.respondido") return;  // ya pintado al enviar
    if (evento.tipo === "confianza.cambiada" && pestana === "estado") {
      cargarEstado();
      return;
    }
    if (evento.tipo?.startsWith("trabajo.")) {
      cargarCola();
      const t = evento.datos?.trabajo;
      if (!t) return;
      // De lo que el chat está siguiendo se calla: ya escribe la respuesta
      // entera, y debajo un «terminado» a secas sobra.
      if (siguiendo.has(t.id)) return;
      if (evento.tipo === "trabajo.hecho") {
        decir(`Trabajo #${t.id} terminado.`, "nota");
      } else if (evento.tipo === "trabajo.fallido") {
        decir(`Trabajo #${t.id} falló: ${t.error ?? ""}`, "nota");
      } else if (evento.tipo === "trabajo.espera_confirmacion") {
        // El aviso lleva a la cola, que es donde están los botones. Aprobar
        // desde el chat obligaría a duplicar el estado en dos sitios.
        decir(`El trabajo #${t.id} pide confirmación — míralo en Cola.`, "nota");
        $("pestana-cola").animate(
          [{ opacity: 1 }, { opacity: .35 }, { opacity: 1 }],
          { duration: 600, iterations: 3 }
        );
      } else if (evento.tipo === "trabajo.rechazado") {
        decir(`Trabajo #${t.id} rechazado.`, "nota");
      }
    }
  };
}

// --------------------------------------------------------------------- //
// Arranque
// --------------------------------------------------------------------- //

function empezar() {
  puerta.style.display = "none";
  restaurarConversacion();
  cargarCola();
  cargarEstado();
  conectarEventos();
  $("entrada").focus();
}

// Con la pantalla apagada o la app en segundo plano no se sondea nada: iOS
// congela el temporizador de todas formas, y al volver interesa el dato de
// ahora y no el de hace media hora.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && pestana === "estado") cargarEstado();
});

(async () => {
  if (await hayCookie()) empezar();
  else puerta.style.display = "flex";
})();
</script>
</body>
</html>
