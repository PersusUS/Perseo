[pytest]
testpaths = pruebas
python_files = test_*.py
addopts = -q --tb=short -p no:asyncio
# Los verificadores de perseo_core/ no son pruebas de pytest: levantan el nucleo
# de verdad y tardan minutos. Se ejecutan a mano, y estan listados en el README.
#
# `-p no:asyncio` no es un capricho: la unica dependencia del nucleo es aiohttp y
# el CI instala eso y pytest, nada mas. Una corrutina de prueba se ejecuta con
# `asyncio.run(...)` dentro de un `def test_` normal, como en todo el resto del
# directorio. Si alguien tiene pytest-asyncio instalado en su maquina, un
# `@pytest.mark.asyncio` le pasaria en verde y fallaria en el CI con "async def
# functions are not natively supported" -- paso el 2026-08-16 y dejo tres pushes
# en rojo. Apagando el plugin aqui, lo local y el CI dicen lo mismo.
